name: Neural Engine Tests (Python)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  neural-engine-tests:
    name: Neural engine (pytest, CPU-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syria-ai-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: syria-ai-core/requirements.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheel of torch is sufficient for every test in this suite
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Print environment
        run: python -c "import sys, torch; print(sys.version.split()[0]); print('torch', torch.__version__, 'cuda:', torch.cuda.is_available())"

      # The suite covers, without any GPU:
      #   - neural model forward/backward + causal masking (tests/test_transformer.py)
      #   - tokenizer training/round-trip/special tokens (tests/test_tokenizer.py)
      #   - dataset pipeline: clean/dedup/privacy/split/pack (tests/test_data_engine.py)
      #   - training loop, checkpoint save/load, resume (tests/test_trainer.py)
      #   - inference load/generate/stream/cancel (tests/test_inference.py)
      #   - robustness: split disjointness, weight-dependence of generation,
      #     strict weight round-trip, streaming consistency, metrics math
      #     (tests/test_robustness.py)
      - name: Run pytest
        run: python -m pytest -v --tb=short

      - name: Smoke — checkpoint reload + generation from real weights
        run: python scripts/selftest.py
